</style><main class="overlay"><div id="sample-slot"></div><p id="display-hint" class="flip-hint">轻点翻面 · 按住拖动看反光</p><nav class="samples" aria-label="样张"><button data-kind="story">故事牌</button><button data-kind="ending">结局牌</button></nav></main><template id="story"><button type="button" class="turnable display-card" aria-describedby="display-hint" aria-label="教堂，翻到牌背"><span class="display-tilt" aria-hidden="true"><span class="card-turn"><span class="inset-illustration"><img class="story-art" src="./western-a30.webp" alt=""></span><div class="card storyface illustrated large"><span class="interrupt">打断</span><strong>教堂</strong></div><div class="card back  large"><span>✧</span><span class="seal">✥</span><strong>故事牌</strong></div></span></span></button></template><template id="ending"><button type="button" class="turnable display-card" aria-describedby="display-hint" aria-label="恶人坠井，翻到牌背"><span class="display-tilt" aria-hidden="true"><span class="card-turn"><div class="card endface large"><span class="kind">✧ 结局目标 ✧</span><span class="sentence">恶人坠井</span><span>❧</span></div><span class="ending-rim"></span><div class="card back endback large"><span>✧</span><span class="seal">☾</span><strong>结局牌</strong></div></span></span></button></template><script>// Keep the hit target stationary while the card inside it turns towards the finger.
function enableDisplayGesture(button) {
  const frontLabel = button.getAttribute('aria-label');
  let grip = null;
  let suppressClick = false;
  let frame = 0;

  function updateTilt() {
    frame = 0;
    if (!grip?.dragging) return;
    const {x, y} = grip;
    button.style.setProperty('--yaw', (x * 26).toFixed(2) + 'deg');
    button.style.setProperty('--pitch', (-y * 19).toFixed(2) + 'deg');
    // A warm reflection passes across the letters as the normal changes.
    const angle = Math.min(1, Math.abs(x + y * .48));
    button.style.setProperty('--foil-at', (125 - angle * 121).toFixed(1) + '%');
  }

  button.addEventListener('pointerdown', event => {
    if (!event.isPrimary || event.button !== 0 || grip) return;
    const rect = button.getBoundingClientRect();
    grip = {id:event.pointerId, startX:event.clientX, startY:event.clientY,
      width:rect.width, height:rect.height, dragging:false};
    suppressClick = false;
    button.setPointerCapture(event.pointerId);
  });

  button.addEventListener('pointermove', event => {
    if (event.pointerId !== grip?.id) return;
    const dx = event.clientX - grip.startX, dy = event.clientY - grip.startY;
    if (!grip.dragging && Math.hypot(dx, dy) < 7) return;
    grip.dragging = true;
    button.classList.add('is-tilting');
    grip.x = Math.max(-1, Math.min(1, dx / (grip.width * .48)));
    grip.y = Math.max(-1, Math.min(1, dy / (grip.height * .38)));
    if (!frame) frame = requestAnimationFrame(updateTilt);
  });

  function release(event) {
    if (event.pointerId !== grip?.id) return;
    suppressClick = grip.dragging || event.type !== 'pointerup';
    grip = null;
    cancelAnimationFrame(frame);
    frame = 0;
    button.classList.remove('is-tilting');
    for (const name of ['--yaw','--pitch','--foil-at']) button.style.removeProperty(name);
  }
  for (const type of ['pointerup','pointercancel','lostpointercapture']) {
    button.addEventListener(type, release);
  }
  button.addEventListener('click', event => {
    if (event.detail && suppressClick) return;
    const back = button.dataset.back !== 'true';
    button.dataset.back = String(back);
    button.setAttribute('aria-label', back ? '牌背，翻回牌面' : frontLabel);
  });
}

const slot=document.getElementById('sample-slot');
function showSample(kind){
 slot.replaceChildren(document.getElementById(kind).content.cloneNode(true));
 enableDisplayGesture(slot.querySelector('button'));
 document.querySelectorAll('[data-kind]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.kind===kind)));
}
document.querySelector('.samples').addEventListener('click',e=>{if(e.target.dataset.kind)showSample(e.target.dataset.kind)});
showSample('story');
</script></html>
