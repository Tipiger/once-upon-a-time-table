 return '<button id="entry" class="deck-entry '+design+'" aria-haspopup="dialog" aria-label="查看'+name+'完整牌组"><span class="fan" aria-hidden="true"><i class="piece ending"></i><i class="piece story"></i><i class="piece cover"><em>'+name+'</em></i></span><span class="copy"><span class="entryname">'+name+'</span><span class="entrymeta">'+countText(m)+'</span><span class="cta">查看完整牌组'+chevron+'</span></span><span class="edge" aria-hidden="true">'+chevron+'</span></button>';

async function render(){

 $('topLabel').textContent=home?'故事牌桌':'‹ 牌局首页';
 document.querySelectorAll('[data-style]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.style===design));
